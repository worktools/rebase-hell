name: npm publish

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
      - name: Install immutable dependencies
        run: |
          set -euo pipefail
          caps --ci
          yarn install --immutable
          caps verify --toolchain
      - name: Check canonical Calcit and types
        run: |
          set -euo pipefail
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit --entry server --check-only --warn-dyn-method
          calcit --check-only --warn-dyn-method
      - name: Build package
        run: yarn compile-server && yarn compile-page && yarn release-page
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
