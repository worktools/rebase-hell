name: Try to upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        cache: yarn

    - uses: calcit-lang/setup-calcit@6a2e53ae41e4f0d5856a424b9ed4470d90ea6876

    - name: Select CDN asset prefix
      id: cos-path
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          prefix="${GITHUB_REPOSITORY}/pr/"
        else
          prefix="${GITHUB_REPOSITORY}/"
        fi
        base_url="https://cos-sh.tiye.me/${prefix}"
        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"
        echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"

    - run: caps --ci && yarn && yarn compile-server && yarn compile-page && yarn release-page

    # - run: mkdir -p dist-server && mv js-out/bundle.js dist-server && cp package.json dist-server/
    #   name: Copy server scripts

    - name: Upload static assets to COS
      if: steps.cos-path.outcome == 'success'
      uses: worktools/cos-upload-action@17e6d213fe9f6772a6090a13c8ba044cd6cbcb09 # v1.1.1
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.cos-path.outputs.prefix }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}
        public-base-url: ${{ steps.cos-path.outputs.base-url }}

    # HTML on the original host references COS assets, so upload it only after COS is verified.
    - name: Upload web assets
      id: deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
