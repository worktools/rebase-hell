name: Try to upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: yarn

    - uses: calcit-lang/setup-calcit@6a2e53ae41e4f0d5856a424b9ed4470d90ea6876

    - name: Select CDN asset prefix
      id: cos-path
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/"
        else
          prefix="${GITHUB_REPOSITORY}/"
        fi
        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "VITE_BASE_URL=https://cos-sh.tiye.me/${prefix}" >> "$GITHUB_ENV"

    - run: caps --ci && yarn && yarn compile-server && yarn compile-page && yarn release-page

    - name: Verify CDN asset references
      if: steps.cos-path.outcome == 'success'
      run: |
        grep -Fq "src=\"${VITE_BASE_URL}assets/" dist/index.html
        grep -Fq "href=\"${VITE_BASE_URL}assets/" dist/index.html

    # - run: mkdir -p dist-server && mv js-out/bundle.js dist-server && cp package.json dist-server/
    #   name: Copy server scripts

    - name: Upload static assets to COS
      if: steps.cos-path.outcome == 'success'
      uses: worktools/cos-upload-action@0ce57b26b03dbdd27a4a544a06d453415932c62d # v1.0.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.cos-path.outputs.prefix }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Verify uploaded page through public CDN
      if: steps.cos-path.outcome == 'success'
      env:
        COS_ASSET_PREFIX: ${{ steps.cos-path.outputs.prefix }}
      run: |
        for attempt in 1 2 3 4 5 6; do
          if curl --fail --location --retry 2 --retry-delay 2 --retry-all-errors \
            "https://cos-sh.tiye.me/${COS_ASSET_PREFIX}index.html?run=${GITHUB_RUN_ID}-${attempt}" \
            --output "$RUNNER_TEMP/cos-index.html" && \
            cmp -s dist/index.html "$RUNNER_TEMP/cos-index.html"; then
            echo "CDN index.html matches dist/index.html on attempt ${attempt}"
            exit 0
          fi
          sleep 2
        done
        echo 'CDN index.html did not match dist/index.html after 6 attempts' >&2
        exit 1

    # HTML on the original host references COS assets, so upload it only after COS is verified.
    - name: Upload web assets
      id: deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
